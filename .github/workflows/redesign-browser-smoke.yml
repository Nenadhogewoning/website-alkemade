name: Redesign browser smoke tests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser-smoke:
    if: github.head_ref == 'design/alkemade-2-concept'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies (report only)
        run: npm audit --omit=dev --json || true
      - name: Contact API integration test with simulated providers
        shell: bash
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          Object.assign(process.env,{TURNSTILE_SITE_KEY:'test-site',TURNSTILE_SECRET_KEY:'test-secret',RESEND_API_KEY:'test-key',CONTACT_FROM_EMAIL:'sender@example.com',CONTACT_TO_EMAIL:'recipient@example.com'});
          const handler=require('./api/contact');
          let verified=true,accepted=true,calls=[];
          global.fetch=async (url,options)=>{
            calls.push(url);
            if(url.includes('siteverify'))return {ok:true,json:async()=>({success:verified,action:'contact_form',hostname:'localhost'})};
            if(url==='https://api.resend.com/emails'){
              const payload=JSON.parse(options.body);
              assert.equal(payload.reply_to,'visitor@example.com');
              assert.deepEqual(payload.to,['recipient@example.com']);
              return {ok:accepted,status:accepted?200:502,json:async()=>accepted?{id:'simulated-id'}:{}};
            }
            throw Error('Unexpected outbound request');
          };
          const body={name:'Test',email:'visitor@example.com',subject:'QA test',message:'Simulated submission',turnstileToken:'test-token'};
          async function request(overrides={}){
            const req={method:'POST',headers:{host:'localhost',origin:'http://localhost','content-type':'application/json'},socket:{remoteAddress:'127.0.0.1'},body,...overrides};
            const res={code:200,setHeader(){},status(code){this.code=code;return this},json(data){this.data=data;return this}};
            await handler(req,res);return res;
          }
          (async()=>{
            assert.equal((await request({method:'GET'})).data.siteKey,'test-site');
            assert.equal((await request({method:'PUT'})).code,405);
            assert.equal((await request({headers:{host:'localhost',origin:'https://example.com'}})).code,403);
            assert.equal((await request({body:{...body,email:'invalid'}})).code,400);
            assert.equal((await request({body:{...body,turnstileToken:''}})).code,400);
            assert.equal(calls.length,0);
            verified=false;
            assert.equal((await request()).data.error,'verification_failed');
            assert.equal(calls.length,1);
            verified=true;
            accepted=false;
            assert.equal((await request()).data.error,'mail_unavailable');
            accepted=true;
            assert.equal((await request()).data.success,true);
            assert.equal(calls.filter(u=>u.includes('resend.com')).length,2);
            console.log('CONTACT PASS: 8 simulated cases; no real messages or provider requests');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.51.1 @axe-core/playwright@4.10.2 lighthouse@12.8.2
      - run: npx playwright install --with-deps chromium
      - name: Test generated site locally, without sending email
        shell: bash
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/alkemade-server.log 2>&1 &
          trap 'kill $!' EXIT
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const {AxeBuilder}=require('@axe-core/playwright');
          (async()=>{
            const browser=await chromium.launch();
            try {
              for(const width of [390,768,1024,1440]){
                const context=await browser.newContext({viewport:{width,height:900},reducedMotion:'reduce'});
                const page=await context.newPage();
                await page.route('**/*',route=>route.request().url().startsWith('http://127.0.0.1:8765/')?route.continue():route.abort());
                const origin='http://127.0.0.1:8765';
                await page.goto(origin+'/');
                assert.equal(await page.locator('.service-card').count(),6);
                assert(await page.locator('.hero-image').isVisible(),'hero visible '+width);
                assert(await page.locator('.hero-image img').evaluate(img=>img.complete&&img.naturalWidth>0),'hero loaded '+width);
                assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2),'horizontal overflow '+width);
                if(width<=1024){
                  await page.locator('.menu-toggle').click();
                  assert.equal(await page.locator('.menu-toggle').getAttribute('aria-expanded'),'true');
                  await page.keyboard.press('Escape');
                  assert.equal(await page.locator('.menu-toggle').getAttribute('aria-expanded'),'false');
                }
                await page.goto(origin+'/galerij.html');
                await page.locator('.gallery-tab[data-category="producten"]').click();
                assert.equal(await page.locator('.gallery-item:visible').count(),2);
                await page.locator('.gallery-tab[data-category="all"]').click();
                assert.equal(await page.locator('.gallery-item:visible').count(),4);
                await page.goto(origin+'/nieuws.html');
                await page.locator('.news-link').click();
                assert(await page.locator('#newsModal').isVisible());
                assert.equal(await page.evaluate(()=>document.activeElement.id),'newsModalClose');
                await page.keyboard.press('Escape');
                assert(!(await page.locator('#newsModal').isVisible()));
                if(width===390||width===1440){
                  for(const path of ['/','/services.html','/mensen.html','/partners.html','/contact.html','/galerij.html','/nieuws.html','/privacy.html']){
                    await page.goto(origin+path);
                    const report=await new AxeBuilder({page}).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa']).analyze();
                    console.log('AXE '+JSON.stringify({width,path,violations:report.violations.map(v=>({id:v.id,impact:v.impact,targets:v.nodes.map(n=>n.target)}))}));
                  }
                }
                await context.close();
                console.log('PASS viewport '+width);
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Lighthouse lab measurement (local build, no production requests)
        if: success() || failure()
        shell: bash
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/alkemade-lighthouse.log 2>&1 &
          trap 'kill $!' EXIT
          export CHROME_PATH=$(node -p "require('playwright').chromium.executablePath()")
          npx lighthouse http://127.0.0.1:8765/ --chrome-flags='--headless --no-sandbox' --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/alkemade-lh.json --quiet --blocked-url-patterns='https://*'
          node -e "const r=require('/tmp/alkemade-lh.json'); console.log('LIGHTHOUSE '+JSON.stringify({scores:Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k,v.score])),metrics:Object.fromEntries(['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index'].map(k=>[k,r.audits[k]?.numericValue]))}))"
